<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario 2027 - Edizione Eden & Checchi</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff758c;
            --secondary: #ff7eb3;
            --text-dark: #ffffff;
            --glass-bg: rgba(0, 0, 0, 0.15);
            --glass-border: rgba(255, 255, 255, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Noto Sans JP', sans-serif;
            background-color: #0b0f19;
            color: var(--text-dark);
            min-height: 100vh;
            padding: 40px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .sakura-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            background: linear-gradient(135deg, #ffb7c5, #ff69b4);
            border-radius: 150% 0 150% 0;
            animation: fall linear infinite;
            opacity: 0.7;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
            }
            100% {
                transform: translateY(110vh) translateX(100px) rotate(360deg);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            width: 100%;
            max-width: 600px;
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.9);
            background: linear-gradient(135deg, #fff 30%, #ff7eb3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #ffb7c5;
            margin-top: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .header .bio-quote {
            font-size: 1.1rem;
            font-weight: 400;
            font-style: italic;
            opacity: 0.95;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            margin-top: 15px;
            line-height: 1.4;
            padding: 0 10px;
        }

        .calendar-grid {
            display: flex;
            flex-direction: column;
            gap: 40px;
            width: 100%;
            max-width: 600px;
            align-items: center;
        }

        .month-card {
            background-color: var(--glass-bg);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            width: 100%;
            transition: transform 0.3s ease;
        }

        .month-card:hover {
            transform: translateY(-5px);
        }

        .month-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.25);
            padding-bottom: 15px;
            background: transparent;
            padding: 15px 20px;
            position: relative;
            z-index: 2;
        }

        .month-title {
            font-size: 2.2rem;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,0.95);
            text-align: center;
            width: 100%;
        }

        .controls-top {
            position: absolute;
            right: 20px;
        }

        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .btn-action {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
            transition: all 0.2s;
        }

        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 18px;
            border-radius: 16px;
            position: relative;
            z-index: 2;
            justify-items: center; /* Centra perfettamente ogni singolo elemento nella sua colonna */
            align-items: center;
        }

        .day-name {
            font-weight: 700;
            font-size: 1rem;
            color: #ffb7c5;
            padding-bottom: 8px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.9);
            width: 100%;
            text-align: center;
        }

        .day {
            aspect-ratio: 1;
            width: 100%;
            max-width: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 500;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s;
            text-shadow: 0 1px 3px rgba(0,0,0,0.95);
            margin: 0 auto;
        }

        .day.empty {
            background: transparent;
            border: none;
        }

        .day.sunday {
            color: #ff9999;
        }

        .actions {
            text-align: center;
            margin-top: 50px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            width: 100%;
            max-width: 600px;
        }

        .btn-main {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 117, 140, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-main:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(255, 117, 140, 0.7);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            padding: 15px 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        @media print {
            body {
                background: white !important;
                padding: 0;
            }
            .sakura-container, .upload-btn-wrapper, .actions {
                display: none !important;
            }
            .month-card {
                break-inside: avoid;
                page-break-inside: avoid;
                border: 1px solid #ccc;
                box-shadow: none;
                margin-bottom: 20px;
                background-color: transparent !important;
            }
        }
    </style>
</head>
<body>

    <div class="sakura-container" id="sakura"></div>

    <div class="header">
        <h1>CALENDARIO 2027</h1>
        <h2>🌸 Edizione Eden & Checchi 🌸</h2>
        <p class="bio-quote">"Sono Eden Benvenuti, questo é il mio calendario e da quando inizia, aspetto che finisca prima di fare una doccia"</p>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>

    <div class="actions">
        <button class="btn-main" onclick="window.print()">🖨️ Stampa / Salva in PDF</button>
        <button class="btn-secondary" onclick="exportBackup()">💾 Salva Backup</button>
        <button class="btn-secondary" onclick="document.getElementById('importFile').click()">📂 Carica Backup</button>
        <input type="file" id="importFile" style="display:none" accept=".json" onchange="importBackup(event)">
        <button class="btn-secondary" style="background: rgba(255,0,0,0.3);" onclick="resetCalendar()">🗑️ Reset</button>
    </div>

    <script>
        const sakuraContainer = document.getElementById('sakura');
        for (let i = 0; i < 25; i++) {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.top = -10 + Math.random() * -20 + 'vh';
            petal.style.width = (Math.random() * 10 + 10) + 'px';
            petal.style.height = petal.style.width;
            petal.style.animationDuration = (Math.random() * 6 + 4) + 's';
            petal.style.animationDelay = (Math.random() * 5) + 's';
            sakuraContainer.appendChild(petal);
        }

        const months = [
            { name: "Gennaio", days: 31, startDay: 4 },
            { name: "Febbraio", days: 28, startDay: 0 },
            { name: "Marzo", days: 31, startDay: 0 },
            { name: "Aprile", days: 30, startDay: 3 },
            { name: "Maggio", days: 31, startDay: 5 },
            { name: "Giugno", days: 30, startDay: 1 },
            { name: "Luglio", days: 31, startDay: 3 },
            { name: "Agosto", days: 31, startDay: 6 },
            { name: "Settembre", days: 30, startDay: 2 },
            { name: "Ottobre", days: 31, startDay: 4 },
            { name: "Novembre", days: 30, startDay: 0 },
            { name: "Dicembre", days: 31, startDay: 2 }
        ];

        const dayNames = ["Lun", "Mar", "Mer", "Gio", "Ven", "Sab", "Dom"];
        const grid = document.getElementById('calendarGrid');

        let photoStates = {};
        try {
            photoStates = JSON.parse(localStorage.getItem('calendar_states_edenchecchi_2027')) || {};
        } catch (e) {
            photoStates = {};
        }

        months.forEach((month, index) => {
            if (!photoStates[index]) {
                photoStates[index] = { scale: 100, posX: 50, posY: 50, url: '' };
            }

            const card = document.createElement('div');
            card.classList.add('month-card');
            card.id = `month-card-${index}`;

            let daysHTML = '';
            dayNames.forEach(d => {
                daysHTML += `<div class="day-name">${d}</div>`;
            });

            for (let i = 0; i < month.startDay; i++) {
                daysHTML += `<div class="day empty"></div>`;
            }

            for (let day = 1; day <= month.days; day++) {
                const dayOfWeek = (month.startDay + day - 1) % 7;
                const isSunday = dayOfWeek === 6;
                daysHTML += `<div class="day ${isSunday ? 'sunday' : ''}">${day}</div>`;
            }

            card.innerHTML = `
                <div class="month-header" id="header-${index}">
                    <div class="month-title">${month.name}</div>
                    <div class="controls-top" id="upload-wrap-${index}">
                        <div class="upload-btn-wrapper">
                            <button class="btn-action">🖼️ Foto</button>
                            <input type="file" accept="image/*" onchange="compressAndLoadPhoto(event, ${index})">
                        </div>
                    </div>
                </div>
                <div class="days-grid">
                    ${daysHTML}
                </div>
            `;

            grid.appendChild(card);

            if (photoStates[index].url) {
                updateBackground(index);
                document.getElementById(`upload-wrap-${index}`).style.display = 'none';
            }
        });

        function compressAndLoadPhoto(event, index) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 700;
                    const MAX_HEIGHT = 700;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);

                    photoStates[index].url = compressedDataUrl;
                    photoStates[index].scale = 100;
                    photoStates[index].posX = 50;
                    photoStates[index].posY = 50;

                    saveAndApply(index);
                    document.getElementById(`upload-wrap-${index}`).style.display = 'none';
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function updateBackground(index) {
            const card = document.getElementById(`month-card-${index}`);
            const state = photoStates[index];
            
            if (state.url) {
                card.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('${state.url}')`;
                card.style.backgroundSize = `${state.scale}%`;
                card.style.backgroundPosition = `${state.posX}% ${state.posY}%`;
            }
        }

        function saveAndApply(index) {
            try {
                localStorage.setItem('calendar_states_edenchecchi_2027', JSON.stringify(photoStates));
                updateBackground(index);
            } catch (e) {
                updateBackground(index);
            }
        }

        function exportBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(photoStates));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "backup_foto_calendario_2027.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    photoStates = JSON.parse(e.target.result);
                    localStorage.setItem('calendar_states_edenchecchi_2027', JSON.stringify(photoStates));
                    location.reload();
                } catch (err) {
                    alert("File di backup non valido.");
                }
            };
            reader.readAsText(file);
        }

        function resetCalendar() {
            if (confirm("Vuoi davvero cancellare tutte le foto salvate?")) {
                localStorage.removeItem('calendar_states_edenchecchi_2027');
                location.reload();
            }
        }
    </script>
</body>
</html>
